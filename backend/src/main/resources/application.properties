spring.application.name=portfolio
server.port=${PORT:8080}

# Where portfolio.json and messages.json live. Edit portfolio.json directly or use /admin.
portfolio.data-dir=${PORTFOLIO_DATA_DIR:./data}

# Password for the /admin editor. Leave empty to disable editing entirely.
portfolio.admin-token=${PORTFOLIO_ADMIN_TOKEN:}

server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
